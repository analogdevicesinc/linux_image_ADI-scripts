name: Build debian package for Linux ADI-scripts

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kuiper2.0
      - '20[1-9][0-9]_R[1-9]'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - kuiper2.0
      - '20[1-9][0-9]_R[1-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identify-version:
    runs-on: ubuntu-latest
    outputs:
      ci-version: ${{ steps.set_version.outputs.ci-version }}
      cloudsmith-version: ${{ steps.set_version.outputs.cloudsmith-version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - name: Set app version
      id: set_version
      shell: bash
      run: |
        .github/scripts/identify-version.sh
      env:
        VERSION_FILE: packaging/VERSION
        CLOUDSMITH_PREFIX: adi-scripts
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runs-on: ubuntu-24.04
            version-suffix: +Ubuntu24.04
          - architecture: amd64
            runs-on: ubuntu-26.04
            version-suffix: +Ubuntu26.04
    runs-on: ${{ matrix.runs-on }}
    needs: identify-version
    container: ${{ matrix.architecture == 'arm64' && matrix.container || '' }}
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      CONTAINER: ${{ matrix.container }}
      PLATFORM: ${{ matrix.platform }}
      CI_VERSION: ${{ needs.identify-version.outputs.ci-version }}
      CLOUDSMITH_VERSION: ${{ needs.identify-version.outputs.cloudsmith-version }}
      CLOUDSMITH_ORG: ${{ secrets.CLOUDSMITH_ORG }}
      CLOUDSMITH_REPO: ${{ secrets.CLOUDSMITH_REPO }}
      VERSION_SUFFIX: ${{ matrix.version-suffix }}
      PACKAGE_NAME: adi-scripts
      CONTROL_PATH: packaging/debian
      OUTPUT_PREFIX: adi-scripts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Install deps
        shell: sh
        run: |
          .github/scripts/install-deps-linux.sh
      # This shared-action is compatible only with amd64/arm64 - armhf is built in install-app.sh
      - name: Create debian package - amd64/arm64
        if: ${{ matrix.architecture == 'amd64' || matrix.architecture == 'arm64' }}
        id: build_deb
        uses: analogdevicesinc/shared-actions/deb-generator-action@main
        with:
          working-directory: .
          ignore-path: |
            packaging
          control-path: packaging/debian
          version: ${{ env.CI_VERSION }}
          version-suffix: ${{ env.VERSION_SUFFIX }}
      # Also debian creation for armhf architecture
      - name: Install and verify application
        shell: sh
        run: |
          .github/scripts/install-app.sh
        env:
          ARTIFACTS_DIR: ${{ steps.build_deb.outputs.artifact-dir || '' }}
      - name: Upload debian artifacts to github
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    #v7
        with:
          name: ${{ env.DEBIAN_ARTIFACT }}
          path: |
            artifacts/
          if-no-files-found: error
      - name: Setup cloudsmith
        if: ${{ env.CLOUDSMITH_VERSION != '' }}
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b    # v3
        with:
          oidc-namespace: ${{ secrets.CLOUDSMITH_ORG }}
          oidc-service-slug: ${{ secrets.CLOUDSMITH_SVC }}
      - name: Push to cloudsmith
        if: ${{ env.CLOUDSMITH_VERSION != '' }}
        shell: bash
        run: |
          .github/scripts/upload-to-cloudsmith.sh
        env:
          WORKSPACE: ${{ github.workspace }}
