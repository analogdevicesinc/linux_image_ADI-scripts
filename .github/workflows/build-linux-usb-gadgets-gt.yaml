name: Build debian package for GT (linux-usb-gadgets)

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kuiper2.0
      - '20[1-9][0-9]_R[1-9]'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - kuiper2.0
      - '20[1-9][0-9]_R[1-9]'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identify-version:
    runs-on: ubuntu-latest
    outputs:
      ci-version: ${{ steps.set_version.outputs.ci-version }}
      cloudsmith-version: ${{ steps.set_version.outputs.cloudsmith-version }}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - name: Set app version
      id: set_version
      shell: bash
      run: |
        .github/scripts/identify-version.sh
      env:
        VERSION_FILE: packaging/VERSION_GT
        CLOUDSMITH_PREFIX: gt
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runs-on: ubuntu-26.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_64:latest
            version-suffix: +Debian13
          - architecture: armhf
            runs-on: ubuntu-26.04-arm
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_32:latest
            platform: linux/arm/v7
            version-suffix: +Debian13
          - architecture: arm64
            runs-on: ubuntu-26.04-arm
            container: debian:forky
            version-suffix: +Debian14
          - architecture: armhf
            runs-on: ubuntu-26.04-arm
            container: debian:forky
            platform: linux/arm/v7
            version-suffix: +Debian14
    runs-on: ${{ matrix.runs-on }}
    needs: identify-version
    container: ${{ matrix.architecture == 'arm64' && matrix.container || '' }}
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      CONTAINER: ${{ matrix.container }}
      PLATFORM: ${{ matrix.platform }}
      CI_VERSION: ${{ needs.identify-version.outputs.ci-version }}
      CLOUDSMITH_VERSION: ${{ needs.identify-version.outputs.cloudsmith-version }}
      CLOUDSMITH_ORG: ${{ secrets.CLOUDSMITH_ORG }}
      CLOUDSMITH_REPO: ${{ secrets.CLOUDSMITH_REPO }}
      VERSION_SUFFIX: ${{ matrix.version-suffix }}
      PACKAGE_NAME: gt
      CONTROL_PATH: packaging/debian
      OUTPUT_PREFIX: gt
    steps:
      - name: Download GT source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: linux-usb-gadgets/gt
      - name: Checkout packaging and CI scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          path: repo-scripts
      - name: Add debian packaging to GT source tree
        # Upstream gt ships a packaging/ dir with only the RPM files, so merge
        # our debian files into it instead of replacing it.
        shell: bash
        run: |
          mkdir -p packaging
          cp -r repo-scripts/packaging/debian_gt packaging/debian
      - name: Install deps
        shell: sh
        run: |
          repo-scripts/.github/scripts/install-deps-linux.sh
      # This shared-action is compatible only with amd64/arm64 - armhf is built in install-app.sh
      - name: Create debian package - amd64/arm64
        if: ${{ matrix.architecture == 'amd64' || matrix.architecture == 'arm64' }}
        id: build_deb
        uses: analogdevicesinc/shared-actions/deb-generator-action@main
        with:
          working-directory: .
          ignore-path: |
            packaging
          control-path: packaging/debian
          version: ${{ env.CI_VERSION }}
          version-suffix: ${{ env.VERSION_SUFFIX }}
      # Also debian creation for armhf architecture
      - name: Install and verify application
        shell: sh
        run: |
          repo-scripts/.github/scripts/install-app.sh
        env:
          ARTIFACTS_DIR: ${{ steps.build_deb.outputs.artifact-dir || '' }}
      - name: Upload debian artifacts to github
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    #v7
        with:
          name: ${{ env.DEBIAN_ARTIFACT }}
          path: |
            artifacts/
          if-no-files-found: error
      - name: Setup cloudsmith
        if: ${{ env.CLOUDSMITH_VERSION != '' }}
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b    # v3
        with:
          oidc-namespace: ${{ secrets.CLOUDSMITH_ORG }}
          oidc-service-slug: ${{ secrets.CLOUDSMITH_SVC }}
      - name: Push to cloudsmith
        if: ${{ env.CLOUDSMITH_VERSION != '' }}
        shell: bash
        run: |
          repo-scripts/.github/scripts/upload-to-cloudsmith.sh
        env:
          WORKSPACE: ${{ github.workspace }}
