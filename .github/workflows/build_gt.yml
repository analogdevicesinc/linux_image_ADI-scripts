name: Build GT

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build debian'
        required: true
        default: '1.0.0'
      cloudsmith_upload:
        description: 'Upload the built debian package to Cloudsmith'
        required: true
        type: boolean
        default: false

env:
  PACKAGE_NAME: gt
  APP_NAME: gt-${{ github.event_name == 'pull_request' && '1.0.0' || inputs.version }}
  VERSION: ${{ github.event_name == 'pull_request' && '1.0.0' || inputs.version }}
  CLOUDSMITH_UPLOAD: ${{ github.event_name == 'pull_request' && 'true' || inputs.cloudsmith_upload }}
  CLOUDSMITH_REPO: ${{ github.event_name == 'pull_request' && secrets.CLOUDSMITH_TEST_REPO || 'adi/kuiper-internal' }}

permissions: 
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_64:latest
          - architecture: armhf
            container: docker.cloudsmith.io/adi/containers/kuiper_basic_32:latest
            platform_flag: "--platform linux/arm/v7"
          - architecture: arm64
            container: debian:latest
          - architecture: armhf
            container: debian:latest
            platform_flag: "--platform linux/arm/v7"
    container: ${{ matrix.architecture == 'arm64' && matrix.container || '' }}
    steps:
      - name: Download GT source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          repository: linux-usb-gadgets/gt
          path: ${{env.APP_NAME}}
      - name: Checkout packaging files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          sparse-checkout: packaging
          sparse-checkout-cone-mode: false
          path: repo-scripts
      - name: Add packaging/ to GT source tree
        # Upstream gt already ships a packaging/ dir with only the RPM files
        # (gt.spec, gt.manifest), so merge our packaging/debian into it
        # instead of copying the dir over it.
        run: |
          mkdir -p "${{env.APP_NAME}}/packaging"
          cp -r repo-scripts/packaging/. "${{env.APP_NAME}}/packaging/"
          ls "${{env.APP_NAME}}/packaging/debian"
          # debug: show what the deb build will see
          ls -la "${{env.APP_NAME}}"
          ls "${{env.APP_NAME}}/source" | head
      - name: Install bootstrap dependencies - arm64
        if: ${{ matrix.architecture == 'arm64' }}
        run: apt-get update && apt-get install -y curl ca-certificates sudo
      # The shared-action is compatible only with amd64/arm64 - armhf runs the
      # same build-deb.sh manually inside an emulated container.
      - name: Build GT deb - arm64
        if: ${{ matrix.architecture == 'arm64' }}
        uses: analogdevicesinc/shared-actions/deb-generator-action@main
        with:
          working-directory: ${{env.APP_NAME}}
          ignore-path: |
            packaging
          control-path: packaging/debian
          version: ${{ env.VERSION }}
      - name: Build GT deb - armhf
        if: ${{ matrix.architecture == 'armhf' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          docker run --rm \
              ${{matrix.platform_flag}} \
              -e VERSION \
              -e GITHUB_WORKSPACE=/workspace \
              -e WORKING_DIRECTORY="/workspace/${{env.APP_NAME}}" \
              -e CONTROL_PATH=packaging/debian \
              -e IGNORE_PATH=packaging \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w "/workspace/${{env.APP_NAME}}" \
              ${{matrix.container}} /bin/bash -c "
                set -e
                apt-get update && apt-get install -y git curl ca-certificates sudo
                git clone https://github.com/analogdevicesinc/shared-actions /tmp/shared-actions
                /tmp/shared-actions/deb-generator-action/build-deb.sh
              "
      - name: Upload GT debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9    # v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.architecture }}
          path: |
            artifacts/${{ env.PACKAGE_NAME }}*.deb
            artifacts/${{ env.PACKAGE_NAME }}*.dsc
            artifacts/${{ env.PACKAGE_NAME }}*.debian.tar.xz
            artifacts/${{ env.PACKAGE_NAME }}*.orig.tar.gz
          if-no-files-found: error
      - name: Authenticate with Cloudsmith via OIDC
        if: success() && env.CLOUDSMITH_UPLOAD == 'true'
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b    # v3
        with:
          oidc-namespace: adi
          oidc-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
      - name: Upload debian package to Cloudsmith
        if: success() && env.CLOUDSMITH_UPLOAD == 'true' && env.CLOUDSMITH_API_KEY != ''
        working-directory: ./artifacts
        run: |
          pip install --break-system-packages cloudsmith-cli
          for f in ${{env.PACKAGE_NAME}}*.dsc ${{env.PACKAGE_NAME}}*.orig.tar.gz ${{env.PACKAGE_NAME}}*.debian.tar.xz; do
            [ -f "$f" ] || continue
            cloudsmith push raw -SW --republish ${{ env.CLOUDSMITH_REPO }} "$f" 
          done
          cloudsmith push deb -SW --republish "${{ env.CLOUDSMITH_REPO }}/debian/trixie" ${{env.PACKAGE_NAME}}_*.deb
